<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Crew</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div id="top">
    <header id="head"></header>
    <section id="crew" aria-label="The Claudes"></section>
    <section id="touched" aria-label="Files touched"></section>
  </div>
  <div id="grip" role="separator" aria-orientation="horizontal" aria-label="Drag to give the Claudes or the log more room" title="Drag to give the Claudes or the log more room. Double-click to reset."><div class="bar"></div></div>
  <section id="viewer">
    <nav id="tabs"></nav>
    <div id="tools" hidden><select id="fWho" class="pick" aria-label="Whose lines"></select><select id="fKind" class="pick" aria-label="Which lines"></select><span id="toolsRest" class="grow-row"></span></div>
    <div id="searchRow" hidden><svg class="ico dim" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zM10.3 10.3l3.2 3.2"/></svg><input id="search" placeholder="Search files and the log…" autocomplete="off" spellcheck="false"></div>
    <div id="body"></div>
  </section>
  <div id="copybox" hidden><div class="row"><span>The clipboard isn't reachable here: copy the log below (Ctrl+C).</span><span class="grow"></span><button class="nb u">close</button></div><textarea readonly spellcheck="false"></textarea></div>
  <div id="flash" hidden></div>
  <div id="gone" hidden>This chat's crew has stopped: the chat ended, or the mod reloaded. Type /crew in the chat to open it again.</div>
</div>
<script src="app.js"></script>
</body>
</html>
